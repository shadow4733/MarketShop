syntax = "proto3";

package proto;

service ProductService {
  rpc GetProduct(GetProductRequest) returns (ProductResponse);
  rpc CreateProduct(CreateProductRequest) returns (ProductResponse);
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc UpdateProduct(UpdateProductRequest) returns (ProductResponse);
  rpc DeleteProduct(DeleteProductRequest) returns (DeleteProductResponse);
  rpc SearchProducts(SearchProductsRequest) returns (ListProductsResponse);
  rpc ApplyDiscount(ApplyDiscountRequest) returns (ProductResponse);
  rpc AssignCategory(AssignCategoryRequest) returns (ProductResponse);
  rpc CheckStock(CheckStockRequest) returns (CheckStockResponse);
  rpc GetPopularProducts(GetPopularProductsRequest) returns (ListProductsResponse);
}

message Product {
  string id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  repeated string category_ids = 5;
  int32 stock_quantity = 6;
  double rating = 7;
  double discount_percent = 8;
  string created_at = 9;
  string updated_at = 10;
}

message GetProductRequest {
  string id = 1;
}

message CreateProductRequest {
  string name = 1;
  string description = 2;
  double price = 3;
}

message ProductResponse {
  Product product = 1;
}

message ListProductsRequest {
  int32 page = 1;
  int32 limit = 2;
}

message ListProductsResponse {
  repeated Product products = 1;
  int32 total = 2;
}

message UpdateProductRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
}

message DeleteProductRequest {
  string id = 1;
}

message DeleteProductResponse {
  bool success = 1;
}

message SearchProductsRequest {
  string query = 1;
  int32 page = 2;
  int32 limit = 3;
  string sort_by = 4;
  string sort_order = 5;
  double min_price = 6;
  double max_price = 7;
}

message ApplyDiscountRequest {
  string product_id = 1;
  double discount_percent = 2;
}

message AssignCategoryRequest {
  string product_id = 1;
  string category_id = 2;
}

message CheckStockRequest {
  string product_id = 1;
}

message CheckStockResponse {
  int32 quantity = 1;
}

message GetPopularProductsRequest {
  int32 limit = 1;
}
